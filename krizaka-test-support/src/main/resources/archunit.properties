# Frozen rules (FrozenRules): the store of recorded violations lives in each module, committed.
# A rule with no store fails (the debt of a new rule is recorded on purpose, see FrozenRules); a new
# violation fails; a fixed one is dropped from the store, which the developer then commits.
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
