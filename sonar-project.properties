sonar.projectKey=krizaka_krizaka-build
sonar.organization=krizaka
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/src/it/**
sonar.exclusions=**/src/test/**,**/src/it/**,**/target/**,**/node_modules/**,site/**
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
# The SQL here is PostgreSQL (initdb scripts), not Oracle PL/SQL: plsql:CharVarchar (use VARCHAR2) does not apply, CHAR(3) is the ISO 4217 code.
sonar.issue.ignore.multiCriteria=postgresSql
sonar.issue.ignore.multiCriteria.postgresSql.ruleKey=plsql:CharVarchar
sonar.issue.ignore.multiCriteria.postgresSql.resourceKey=**/*.sql
