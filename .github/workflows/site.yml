# The documentation site (site/, java.krizaka.com): lint, tests and the static build on every pull request. The deployment
# is DigitalOcean App Platform's (.do/app.yaml): it rebuilds and publishes on every push to main.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # the site reads Maven Central and the POMs of the other repositories: build it weekly too

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    name: Static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Generate the content types (the package postinstall, run explicitly since install scripts are off)
        run: ./node_modules/.bin/fumadocs-mdx
      - run: npm run gen
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Every page is in out/
        run: test -f out/index.html && test -f out/fr/index.html && test -f out/start/index.html && test -f out/fr/start/index.html && test -f out/map/index.html && test -f out/fr/map/index.html && test -f out/features/index.html && test -f out/fr/features/index.html && test -f out/configuration/index.html && test -f out/fr/configuration/index.html && test -f out/idempotency/index.html && test -f out/persistence/index.html && test -f out/llms.txt && test -f out/sitemap.xml
      - name: SEO family contract (robots, AI crawlers, sitemap, llms.txt, canonical, JSON-LD back to Krizaka)
        run: |
          python3 -m http.server 3000 --directory out >/dev/null 2>&1 &
          sleep 2
          node scripts/check-seo-family.mjs --base http://localhost:3000 --host https://java.krizaka.com --types WebSite,SoftwareSourceCode --limit 60
      - name: No horizontal overflow (360 to 1440 px, both languages, both themes)
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 3100 --directory out >/dev/null 2>&1 &
          sleep 2
          node scripts/check-overflow.mjs --base http://localhost:3100
