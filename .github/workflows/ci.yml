# Verifies the parent POM and the BOM on every change (with the release profile, unsigned), and on a
# v* tag deploys them to GitHub Packages (registry input of the pipeline, ADR-019). The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@be08be836bcce567d84a679d3f40aefab79ca4cc # main
    # packages: write publishes to GitHub Packages on a tag (ADR-019); read lets pull requests resolve the blocks.
    permissions:
      contents: read
      packages: write
    with:
      registry: github   # GitHub Packages (ADR-019); "central" or "github,central" switch it
      sonar: true   # CI analysis with JaCoCo coverage; the merge queue branch is analysed too
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  bom-released:
    # krizaka-internal#1878: the BOM manages only released versions of the building blocks (a `v<version>` tag each).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: node --test scripts/check-bom-released.test.mjs
      - run: node scripts/check-bom-released.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  quality-script:
    # The baseline script of PMD and SpotBugs (krizaka-build#105): dependency-free Node, tested here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: node --test scripts/quality-baseline.test.mjs scripts/pmd-modules.test.mjs

  canary:
    # A consumer of krizaka-parent with no baselines, verified with PMD and SpotBugs on (krizaka-build#105): a parent
    # change cannot break the repositories that inherit it without failing here first.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent
      - run: ./mvnw -B -ntp -f canary/pom.xml -Dkrizaka.quality.phase=verify verify
      # NullAway bites (ADR-015): a class returning null from a @NullMarked package must fail the compilation.
      - run: |
          if ./mvnw -B -ntp -f canary/pom.xml -Pcanary-violation -Dkrizaka.quality.phase=none compile > violation.log 2>&1; then
            echo "::error::the NullAway violation compiled: the profile checks nothing"; exit 1
          fi
          grep -q "NullAway" violation.log || { cat violation.log; echo "::error::the build failed, but not on NullAway"; exit 1; }

  consumers:
    # Real consumers of the parent from this change (a bug found 2026-10-28: the NullAway profile of #121 broke every
    # repository whose modules declare their own annotationProcessorPaths, and nothing here built one). The parent is
    # installed from the pull request, then krizaka-platform-kit (modules with their own annotation processors) and
    # krizaka-users (a service on top of it) are compiled against it, tests skipped. Both resolve the parent through
    # ../krizaka-build/krizaka-parent, so they are checked out next to this repository.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: krizaka-build
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/krizaka-platform-kit
          path: krizaka-platform-kit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: krizaka/krizaka-users
          path: krizaka-users
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install the parent, the BOM, the quality and test-support modules from this change
        working-directory: krizaka-build
        run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent,krizaka-test-support
      - name: Read the version of this change
        id: version
        working-directory: krizaka-build
        run: echo "value=$(./mvnw -B -ntp -q -N help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      # The kit names the parent it was released on (<parent> is a literal, not a property); on a release PR this build is
      # already the next version, which the kit cannot name yet and which is not published, so the consumers are pointed at
      # the version just installed (the parent block of their checkout only, never committed).
      - name: Point the consumers at the parent just installed
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          for repo in krizaka-platform-kit krizaka-users; do
            perl -0pi -e 's|(<artifactId>krizaka-parent</artifactId>\s*<version>)[^<]*(</version>)|$1$ENV{BUILD_VERSION}$2|' "$repo/pom.xml"
          done
      # The BOM names the last released kit; the consumers are compiled against the kit's main (which the service reads
      # through that BOM), so the installed BOM names it too. A release of the kit and the BOM's version meet again then.
      - name: Install the BOM, naming the kit as it is on main
        working-directory: krizaka-build
        run: |
          # Read from the pom's text, not by evaluating it: Maven would resolve the kit's import of krizaka-bom at the last
          # released build, which is not on Central, and fail silently under -q before the BOM could be installed.
          kit="$(perl -0ne 'print $1 if m|<artifactId>krizaka-platform-kit</artifactId>(?:\s*<!--.*?-->)*\s*<version>([^<]+)</version>|s' ../krizaka-platform-kit/pom.xml)"
          test -n "$kit"
          sed -i "s|<krizaka-platform-kit.version>[^<]*<|<krizaka-platform-kit.version>${kit}<|" krizaka-bom/pom.xml
          ./mvnw -B -ntp -q install -DskipTests -pl krizaka-bom
      # The kits pin the last release (krizaka-build.version); a release PR moves this build to the next one, which the
      # kits cannot name yet, so they are compiled against the version just installed.
      - name: Compile krizaka-platform-kit against it
        working-directory: krizaka-platform-kit
        run: ./mvnw -B -ntp install -DskipTests -Dkrizaka.quality.phase=none -Dkrizaka-build.version=${{ steps.version.outputs.value }}
      - name: Compile krizaka-users against it
        working-directory: krizaka-users
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        # Its parent block was pointed at this build above, and krizaka-build.version names the BOM just installed.
        run: |
          ./mvnw -B -ntp test-compile -Dkrizaka.quality.phase=none -Dkrizaka-build.version="$BUILD_VERSION"

  pmd-modules:
    # The modules of THIS repository under the consumers' PMD and SpotBugs rules (krizaka-internal#159). This reactor
    # switches the checks off (.mvn/maven.config) because its parent must resolve the rules first, so a module such as
    # krizaka-payments passed here and broke the orazaka workspace, which inherits the same parent and the same ruleset.
    # The rules are installed from this change, then every shipped module is verified with the checks on, as a consumer
    # would. scripts/pmd-modules.test.mjs fails when a module with sources is missing from the list below.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent
      - run: ./mvnw -B -ntp -Dkrizaka.quality.phase=verify -DskipTests verify -pl krizaka-rewrite-style,krizaka-test-support,krizaka-payments # pmd-modules
