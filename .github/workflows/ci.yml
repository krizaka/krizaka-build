# Verifies the parent POM and the BOM on every change (with the release profile, unsigned), and on a
# v* tag signs and uploads the whole reactor to Maven Central, the one registry of com.krizaka since 2026-11-06
# (GitHub Packages is abandoned for Maven; registry input of the pipeline, ADR-019). The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@ab6100359ba4962c61a021f55c53b549d385af4e # main
    permissions:
      contents: read
    with:
      registry: central   # Maven Central only (founder, 2026-11-06); the deployment waits for Publish (autoPublish=false)
      threads: "2"
      sonar: true   # CI analysis with JaCoCo coverage; the merge queue branch is analysed too
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  bom-released:
    # krizaka-internal#1878: the BOM manages only released versions of the building blocks (a `v<version>` tag each).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: node --test scripts/check-bom-released.test.mjs scripts/check-published.test.mjs
      - run: node scripts/check-bom-released.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  quality-script:
    # The baseline script of PMD and SpotBugs (krizaka-java#105): dependency-free Node, tested here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: node --test scripts/quality-baseline.test.mjs scripts/pmd-modules.test.mjs scripts/family-version.test.mjs scripts/sonar-properties.test.mjs scripts/ci-deploy-inputs.test.mjs scripts/deleted-repositories.test.mjs

  canary:
    # A consumer of krizaka-parent with no baselines, verified with PMD and SpotBugs on (krizaka-java#105): a parent
    # change cannot break the repositories that inherit it without failing here first.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent
      - run: ./mvnw -B -ntp -f canary/pom.xml -Dkrizaka.quality.phase=verify verify
      # NullAway bites (ADR-015): a class returning null from a @NullMarked package must fail the compilation.
      - run: |
          if ./mvnw -B -ntp -f canary/pom.xml -Pcanary-violation -Dkrizaka.quality.phase=none compile > violation.log 2>&1; then
            echo "::error::the NullAway violation compiled: the profile checks nothing"; exit 1
          fi
          grep -q "NullAway" violation.log || { cat violation.log; echo "::error::the build failed, but not on NullAway"; exit 1; }

  consumers:
    # Real consumers of the parent from this change (a bug found 2026-10-28: the NullAway profile of #121 broke every
    # repository whose modules declare their own annotationProcessorPaths, and nothing here built one). Users, a service on
    # top of the parent, is a folder of this reactor since ADR-021: the whole reactor is installed from the pull request,
    # tests skipped, and krizaka-users is compiled with it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install the whole reactor from this change (parent, BOM, quality, test-support, service kit, users, billing)
        run: ./mvnw -B -ntp -q install -DskipTests

  pmd-modules:
    # The modules of THIS repository under the consumers' PMD and SpotBugs rules (krizaka-internal#159). This reactor
    # switches the checks off (.mvn/maven.config) because its parent must resolve the rules first, so a module such as
    # krizaka-payments passed here and broke the sovkora workspace, which inherits the same parent and the same ruleset.
    # The rules are installed from this change, then every shipped module is verified with the checks on, as a consumer
    # would. scripts/pmd-modules.test.mjs fails when a module with sources is missing from the list below.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent
      - run: ./mvnw -B -ntp -Dkrizaka.quality.phase=verify -DskipTests verify -pl krizaka-rewrite-style,krizaka-test-support,krizaka-payments # pmd-modules
      # The service kit (ADR-021): its modules under the consumers' rules too, from the rules and test kit just installed.
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent,krizaka-bom,krizaka-rewrite-style,krizaka-test-support
      - run: ./mvnw -B -ntp -Dkrizaka.quality.phase=verify -DskipTests verify -f krizaka-service-kit/pom.xml -pl '!:krizaka-notifications-service' # pmd-kit
      # OpenRewrite on the kit only (the org pipeline would also run it on krizaka-parent, whose plugin versions are this repository's to move).
      - run: ./mvnw -B -ntp rewrite:dryRun -f krizaka-service-kit/pom.xml -pl '!:krizaka-notifications-service'
