# Verifies the parent POM and the BOM on every change (with the release profile, unsigned), and on a
# v* tag deploys them to GitHub Packages (registry input of the pipeline, ADR-019). The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@d2b109a67cec3a35ed0bcbc09ae63da2d3084c00 # main
    # packages: write publishes to GitHub Packages on a tag (ADR-019); read lets pull requests resolve the blocks.
    permissions:
      contents: read
      packages: write
    with:
      registry: github   # GitHub Packages (ADR-019); "central" or "github,central" switch it
      threads: "2"
      sonar: true   # CI analysis with JaCoCo coverage; the merge queue branch is analysed too
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  bom-released:
    # krizaka-internal#1878: the BOM manages only released versions of the building blocks (a `v<version>` tag each).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: node --test scripts/check-bom-released.test.mjs
      - run: node scripts/check-bom-released.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  quality-script:
    # The baseline script of PMD and SpotBugs (krizaka-build#105): dependency-free Node, tested here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: node --test scripts/quality-baseline.test.mjs scripts/pmd-modules.test.mjs

  canary:
    # A consumer of krizaka-parent with no baselines, verified with PMD and SpotBugs on (krizaka-build#105): a parent
    # change cannot break the repositories that inherit it without failing here first.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent
      - run: ./mvnw -B -ntp -f canary/pom.xml -Dkrizaka.quality.phase=verify verify
      # NullAway bites (ADR-015): a class returning null from a @NullMarked package must fail the compilation.
      - run: |
          if ./mvnw -B -ntp -f canary/pom.xml -Pcanary-violation -Dkrizaka.quality.phase=none compile > violation.log 2>&1; then
            echo "::error::the NullAway violation compiled: the profile checks nothing"; exit 1
          fi
          grep -q "NullAway" violation.log || { cat violation.log; echo "::error::the build failed, but not on NullAway"; exit 1; }

  pmd-modules:
    # The modules of THIS repository under the consumers' PMD and SpotBugs rules (krizaka-internal#159). This reactor
    # switches the checks off (.mvn/maven.config) because its parent must resolve the rules first, so a module such as
    # krizaka-payments passed here and broke the orazaka workspace, which inherits the same parent and the same ruleset.
    # The rules are installed from this change, then every shipped module is verified with the checks on, as a consumer
    # would. scripts/pmd-modules.test.mjs fails when a module with sources is missing from the list below.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent
      - run: ./mvnw -B -ntp -Dkrizaka.quality.phase=verify -DskipTests verify -pl krizaka-rewrite-style,krizaka-test-support,krizaka-payments # pmd-modules
      # The platform kit (ADR-021): its modules under the consumers' rules too, from the rules and test kit just installed; the users API is installed too, the kit's notifications service tests against it.
      - run: ./mvnw -B -ntp -q install -DskipTests -pl krizaka-quality,krizaka-parent,krizaka-bom,krizaka-rewrite-style,krizaka-test-support,krizaka-users/krizaka-users-api -am
      - run: ./mvnw -B -ntp -Dkrizaka.quality.phase=verify -DskipTests verify -f krizaka-platform-kit/pom.xml # pmd-kit
      # OpenRewrite on the kit only (the org pipeline would also run it on krizaka-parent, whose plugin versions are this repository's to move).
      - run: ./mvnw -B -ntp rewrite:dryRun -f krizaka-platform-kit/pom.xml
